[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeline-macos"
version = "0.1.0"
description = "Local gaze-correction camera pipeline for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "BSD-3-Clause" }
dependencies = [
  "mediapipe==0.10.32",
  "numpy==1.26.4",
  "opencv-contrib-python==4.11.0.86",
  "pyobjc-core==12.2.1",
  "pyobjc-framework-Cocoa==12.2.1",
  "pyobjc-framework-Quartz==12.2.1",
  "pyobjc-framework-Vision==12.2.1",
  "pyvirtualcam==0.15.0",
  "PyYAML==6.0.3",
  "tensorflow==2.19.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[project.scripts]
eyeline = "eyeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
